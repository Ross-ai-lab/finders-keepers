<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finders Keepers</title>
<meta name="description" content="A text-first choice RPG. A drifter, an empty house, a garage that should not exist.">
<style>
:root {
  --bg: #07080c;
  --panel: rgba(10, 12, 17, 0.92);
  --panel-solid: #10131b;
  --panel-2: rgba(22, 26, 36, 0.92);
  --line: rgba(255, 255, 255, 0.10);
  --line-strong: rgba(255, 255, 255, 0.22);
  --text: #e9e4d8;
  --text-dim: #a8a395;
  --text-faint: #6f6c63;
  --accent: #8dff7a;          /* portal green */
  --accent-dim: rgba(141, 255, 122, 0.18);
  --warn: #ffb547;
  --danger: #ff5d5d;
  --cold: #9fd6ff;
  --fire: #ff8a3d;
  --spore: #b6ff9e;
  --remember: #f2c96b;
  --force: #ff7a6b;
  --science: #7ad8ff;
  --gadget: #b59cff;
  --talk: #ffd36b;
  --sneak: #8ef0c4;
  --flee: #c9c3b5;
  --betray: #ff6bb5;
  --neutral: #8a8678;
  --story-font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --ui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: var(--ui-font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; }

#bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; display: block; }
#vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.55) 100%); }
#app { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; }

/* ---------------------------------------------------------------- top bar */
#topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; background: linear-gradient(180deg, rgba(5,6,10,0.92), rgba(5,6,10,0.72));
  border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.tb-left { min-width: 150px; }
.tb-chapter { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
.tb-loc { font-family: var(--story-font); font-size: 18px; }
.tb-stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(255,255,255,0.04); font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; }
.hearts { letter-spacing: 1px; color: var(--danger); font-size: 13px; }
.hearts .empty { color: var(--text-faint); }
.heat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
.heat-bar { width: 84px; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
.heat-fill { height: 100%; background: linear-gradient(90deg, #ffd36b, #ff8a3d, #ff4d4d); transition: width .4s; }
.tb-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.tb-nav .btn { padding: 6px 10px; font-size: 12px; position: relative; }
.badge-dot { position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* ---------------------------------------------------------------- page */
#stage { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 28px 16px 80px; }
#page { width: 100%; max-width: 760px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 30px 34px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); backdrop-filter: blur(3px);
  animation: pageIn .45s ease; }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.kicker { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
h1.title { font-family: var(--story-font); font-weight: 600; font-size: 32px; line-height: 1.15; margin: 0 0 18px; text-wrap: balance; }
.story p { font-family: var(--story-font); font-size: 19px; line-height: 1.68; margin: 0 0 1em; color: var(--text); }
.story p:first-of-type::first-letter { font-size: 1.15em; }
.story em { color: #fff; }
.result-text p { font-family: var(--story-font); font-size: 18.5px; line-height: 1.66; margin: 0 0 1em; }

.choices { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.choice { width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
  border-radius: var(--radius); border: 1px solid var(--line); background: rgba(255,255,255,0.03); cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s; }
.choice:hover, .choice:focus-visible { background: rgba(255,255,255,0.07); border-color: var(--line-strong); outline: none; }
.choice:active { transform: translateY(1px); }
.choice .num { font-family: var(--mono); font-size: 12px; color: var(--text-faint); min-width: 14px; padding-top: 3px; }
.choice .ico { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.choice .body { flex: 1; }
.choice .label { font-family: var(--story-font); font-size: 17.5px; line-height: 1.4; }
.choice .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-size: 11px; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; opacity: 0.9; }
.tag.approach { text-transform: uppercase; letter-spacing: 0.1em; }
.tag.req { color: var(--text-dim); border-color: var(--line-strong); }
.tag.puzzle { color: var(--accent); }
.hidden-note { margin-top: 12px; font-size: 13px; color: var(--text-faint); font-style: italic; }

.a-force { color: var(--force); } .a-science { color: var(--science); } .a-gadget { color: var(--gadget); }
.a-talk { color: var(--talk); } .a-sneak { color: var(--sneak); } .a-flee { color: var(--flee); }
.a-betray { color: var(--betray); } .a-neutral { color: var(--neutral); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: var(--radius);
  border: 1px solid var(--line-strong); background: rgba(255,255,255,0.06); cursor: pointer; font-size: 14px; color: var(--text);
  transition: background .15s, border-color .15s; }
.btn:hover, .btn:focus-visible { background: rgba(255,255,255,0.12); outline: none; border-color: rgba(255,255,255,0.35); }
.btn.primary { background: var(--accent-dim); border-color: rgba(141,255,122,0.55); color: #e9ffe4; }
.btn.primary:hover { background: rgba(141,255,122,0.28); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { border-color: rgba(255,93,93,0.5); color: #ffd6d6; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { height: 18px; }

/* ---------------------------------------------------------------- hub */
.hub-text p { font-family: var(--story-font); font-size: 18px; line-height: 1.6; color: var(--text); margin: 0 0 .8em; }
.section-label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); margin: 22px 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.card { text-align: left; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-2);
  cursor: pointer; transition: border-color .15s, transform .15s, background .15s; min-height: 82px; }
.card:hover, .card:focus-visible { border-color: rgba(141,255,122,0.5); transform: translateY(-2px); outline: none; }
.card .c-title { font-family: var(--story-font); font-size: 17px; margin-bottom: 4px; }
.card .c-teaser { font-size: 13px; color: var(--text-dim); line-height: 1.4; }
.card.repeat .c-title::after { content: " ↻"; color: var(--text-faint); font-size: 13px; }
.travel { display: flex; gap: 8px; flex-wrap: wrap; }
.notice { font-size: 13px; color: var(--accent); margin-top: 12px; }
.ending-note { margin: 18px 0 22px; }
.notice button { color: var(--accent); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; }

/* ---------------------------------------------------------------- title + build */
.title-screen { text-align: center; padding: 20px 0 10px; }
.logo { font-family: var(--story-font); font-size: clamp(40px, 8vw, 68px); letter-spacing: 0.02em; margin: 6px 0 4px;
  background: linear-gradient(180deg, #f5f0e2, #8dff7a 140%); -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 40px rgba(141,255,122,0.12); }
.subtitle { color: var(--text-dim); font-size: 15px; margin-bottom: 26px; font-style: italic; font-family: var(--story-font); }
.title-actions { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
.title-actions .btn { padding: 13px; font-size: 15px; }
.fineprint { color: var(--text-faint); font-size: 12px; margin-top: 22px; line-height: 1.5; }
.build-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.opt { text-align: left; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, 0 0 18px rgba(141,255,122,0.15); }
.opt .o-name { font-family: var(--story-font); font-size: 18px; margin-bottom: 4px; }
.opt .o-desc { font-size: 13px; color: var(--text-dim); line-height: 1.4; }

/* ---------------------------------------------------------------- toasts */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
.toast { padding: 9px 14px; border-radius: 8px; background: rgba(10,12,18,0.95); border: 1px solid var(--line-strong); font-size: 13px;
  animation: toastIn .35s ease, toastOut .5s ease 3.6s forwards; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.toast.remember { border-color: var(--remember); color: var(--remember); font-family: var(--story-font); font-size: 15px; font-style: italic; }
.toast.clue { border-color: var(--accent); color: var(--accent); }
.toast.hurt { border-color: var(--danger); color: #ffc9c9; }
.toast.heat { border-color: var(--warn); color: var(--warn); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

/* ---------------------------------------------------------------- modal */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.6); display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto; }
#modal[hidden] { display: none; }
.modal-card { width: 100%; max-width: 920px; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 14px;
  padding: 20px 22px 24px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); animation: pageIn .3s ease; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-head h2 { font-family: var(--story-font); font-weight: 600; margin: 0; font-size: 24px; }

/* inventory */
.inv { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.slot { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px; padding: 6px; cursor: default; position: relative; }
.slot.filled { cursor: pointer; background: rgba(255,255,255,0.06); border-color: var(--line-strong); }
.slot.filled:hover, .slot.sel { border-color: var(--accent); }
.slot svg { width: 52%; height: auto; }
.slot .s-name { font-size: 10px; text-align: center; color: var(--text-dim); line-height: 1.15; max-height: 2.3em; overflow: hidden; }
.detail { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 14px; line-height: 1.5; }
.detail h3 { margin: 0 0 6px; font-family: var(--story-font); font-size: 19px; }
.detail .read { font-family: var(--story-font); font-size: 15px; background: #e8e1cf; color: #2a251c; padding: 12px; border-radius: 4px; margin-top: 10px; line-height: 1.55; }
.money { margin-top: 12px; font-size: 13px; color: var(--text-dim); }

/* map */
.mapwrap { position: relative; }
#mapcanvas { width: 100%; height: auto; aspect-ratio: 16 / 10; display: block; border-radius: 10px; background: #04060a; border: 1px solid var(--line); cursor: pointer; }
.map-legend { font-size: 13px; color: var(--text-dim); margin-top: 10px; line-height: 1.5; }

/* skills */
.tree { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.branch h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); text-align: center; }
.sk { position: relative; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 18px; background: rgba(255,255,255,0.03); font-size: 12.5px; }
.sk:not(:last-child)::after { content: ""; position: absolute; left: 50%; bottom: -19px; width: 2px; height: 18px; background: var(--line-strong); }
.sk.on { border-color: var(--accent); background: rgba(141,255,122,0.08); }
.sk.on:not(:last-child)::after { background: var(--accent); }
.sk.can { border-color: rgba(141,255,122,0.5); border-style: dashed; }
.sk .sk-name { font-family: var(--story-font); font-size: 15.5px; margin-bottom: 3px; }
.sk .sk-desc { color: var(--text-dim); line-height: 1.35; }
.sk .btn { margin-top: 8px; padding: 5px 9px; font-size: 12px; width: 100%; }

/* base */
.base-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.up { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: rgba(255,255,255,0.03); }
.up.on { border-color: var(--accent); }
.up h4 { margin: 0 0 4px; font-family: var(--story-font); font-size: 17px; font-weight: 600; }
.up p { margin: 0 0 8px; font-size: 13px; color: var(--text-dim); line-height: 1.4; }
.base-art { width: 100%; height: 150px; display: block; border-radius: 10px; margin-bottom: 14px; background: #0b0d12; border: 1px solid var(--line); }

/* journal */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.45; }
.list li:last-child { border-bottom: none; }
.mem { font-family: var(--story-font); font-size: 15px; }
.rep-bar { display: inline-block; width: 70px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; position: relative; vertical-align: middle; margin-left: 6px; }
.rep-bar i { position: absolute; top: 0; bottom: 0; background: var(--remember); border-radius: 3px; }

/* flowchart */
.flow-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.pct { font-family: var(--story-font); font-size: 34px; color: var(--accent); line-height: 1; }
.pct small { font-size: 14px; color: var(--text-dim); font-family: var(--ui-font); margin-left: 6px; }
.flowbox { overflow: auto; max-height: 64vh; border: 1px solid var(--line); border-radius: 10px; background: #06080c; }
.flowbox svg { display: block; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.endlist { columns: 2; column-gap: 22px; font-size: 13px; color: var(--text-dim); margin-top: 12px; }
.endlist div { break-inside: avoid; padding: 3px 0; }
.endlist .found { color: var(--text); }

/* puzzles */
.puzzle { margin-top: 18px; padding: 18px; border: 1px solid rgba(141,255,122,0.35); border-radius: 12px; background: rgba(4,10,6,0.6); }
.puzzle .p-prompt { font-size: 14px; color: var(--text-dim); margin-bottom: 14px; }
.keypad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; }
.keypad .btn { height: 52px; font-family: var(--mono); font-size: 18px; }
.lcd { font-family: var(--mono); font-size: 28px; letter-spacing: .4em; text-align: center; padding: 10px; margin: 0 auto 14px; max-width: 230px;
  background: #0d1a0d; color: var(--accent); border-radius: 6px; border: 1px solid rgba(141,255,122,0.3); min-height: 54px; }
.lcd.bad { color: var(--danger); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.lights { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; justify-content: center; }
.light { height: 70px; border-radius: 10px; border: 1px solid var(--line-strong); background: #1b1b1b; cursor: pointer; transition: background .15s, box-shadow .15s; }
.light.on { background: #ffbf47; box-shadow: 0 0 22px rgba(255,191,71,0.6) inset, 0 0 14px rgba(255,191,71,0.35); }
.dials { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.dial { width: 110px; text-align: center; }
.dial .face { width: 110px; height: 110px; border-radius: 50%; border: 2px solid #b08d4c; background: radial-gradient(circle, #2a2418, #120f09);
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .25s; }
.dial .face svg { width: 54px; height: 54px; }
.dial .dname { font-size: 11px; letter-spacing: .12em; color: var(--text-dim); margin-top: 6px; }
.seq-slots, .seq-tokens { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
.seq-slot { width: 86px; height: 46px; border-radius: 8px; border: 1px dashed var(--line-strong); display: flex; align-items: center; justify-content: center;
  font-size: 12px; letter-spacing: .08em; color: var(--accent); cursor: pointer; }
.seq-token { min-width: 86px; }
.moves { text-align: center; font-size: 12px; color: var(--text-faint); margin-top: 10px; }

/* death + ending */
.death h1.title { color: var(--danger); }
.ending-title { font-family: var(--story-font); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.summary-list { list-style: none; padding: 0; margin: 0 0 18px; }
.summary-list li { font-family: var(--story-font); font-size: 17px; line-height: 1.5; padding: 6px 0 6px 16px; border-left: 2px solid var(--accent-dim); margin-bottom: 4px; }

.saves { display: grid; gap: 10px; }
.save-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; flex-wrap: wrap; }
.save-row .meta { font-size: 13px; color: var(--text-dim); }

@media (max-width: 720px) {
  #page { padding: 20px 18px; }
  h1.title { font-size: 26px; }
  .story p { font-size: 17.5px; }
  .inv, .cols { grid-template-columns: 1fr; }
  .tree { grid-template-columns: repeat(2, 1fr); }
  .endlist { columns: 1; }
  #topbar { gap: 8px; padding: 8px 12px; }
  .tb-nav .btn { padding: 5px 8px; font-size: 11.5px; }
}
@media (prefers-reduced-motion: reduce) {
  #page, .modal-card, .toast { animation: none; }
}

</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="app">
  <header id="topbar" hidden>
    <div class="tb-left">
      <div id="tb-chapter" class="tb-chapter"></div>
      <div id="tb-loc" class="tb-loc"></div>
    </div>
    <div id="tb-stats" class="tb-stats"></div>
    <nav id="tb-nav" class="tb-nav" aria-label="Game menus"></nav>
  </header>
  <main id="stage">
    <article id="page" aria-live="polite"></article>
  </main>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="btn ghost" id="modal-close" aria-label="Close">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>
</div>
<script>
/* Finders Keepers — storylet engine.
 *
 * Pure logic, no DOM: the page and the Node route checker both drive it.
 * Content registers itself through FK.S / FK.item / FK.skill / ... and is plain
 * data (requirement and effect strings), so the checker can read every gate.
 *
 * Requirements are small boolean expressions:  "muscle>=3 & (item:crowbar | skill:brawler) & !alarm"
 * Effects are short op strings:                 ["+flag", "-flag", "heat+2", "give:crowbar", "rep:dolores-1"]
 */
(function (G) {
  'use strict';
  var FK = G.FK = G.FK || {};

  var DB = FK.DB = {
    storylets: {}, order: [], items: {}, skills: {}, upgrades: {}, reps: {},
    dests: {}, locs: {}, chapters: {}, ending: null, config: {}, deaths: {}
  };

  /* ------------------------------------------------------------ registration */

  FK.S = function (s) {
    if (DB.storylets[s.id]) throw new Error('duplicate storylet ' + s.id);
    if (s.once === undefined) s.once = true;
    s.choices = s.choices || [];

  FK.item = function (id, d) { d.id = id; DB.items[id] = d; };

  FK.upgrade = function (id, d) { d.id = id; DB.upgrades[id] = d; };
  FK.rep = function (id, d) { d.id = id; DB.reps[id] = d; };
  FK.dest = function (id, d) { d.id = id; DB.dests[id] = d; };

  var parseCache = {};

      case 'kills': return Object.keys(s.dead).length;
      case 'settled': return Object.keys(s.flags).filter(function (f) { return f.indexOf('settled_') === 0 && s.flags[f]; }).length;

  /* Atoms that describe the player's build, so a hidden choice can be counted

  function buildAtoms(n, neg, out) {
    if (!n) return out;

    if (n.op === 'and' || n.op === 'or') { buildAtoms(n.a, neg, out); buildAtoms(n.b, neg, out); return out; }
    if (neg) return out;

    else if (n.op === 'has' && (n.kind === 'item' || n.kind === 'skill' || n.kind === 'up' || n.kind === 'cap' || n.kind === 'knack' || n.kind === 'habit')) out.push(n);

      else if (n.kind === 'skill') l = DB.skills[n.k] ? DB.skills[n.k].name : n.k;
      else if (n.kind === 'up') l = DB.upgrades[n.k] ? DB.upgrades[n.k].name : n.k;
      else if (n.kind === 'cap') l = 'Captive: ' + (DB.reps[n.k] ? DB.reps[n.k].name : n.k);

  function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }
  FK.cap = cap;

  /* ------------------------------------------------------------ state */

  FK.newGame = function (knack, habit) {
    var C = DB.config;
    var s = {
      v: 1, ch: 1, loc: C.startLoc || 'house', turn: 0,
      stats: { muscle: 1, brains: 1, mouth: 1, sneak: 1 },
      hp: 3, maxhp: 3, heat: 0, scrap: 0, sp: 1,
      flags: {}, vars: {}, items: [], stash: [], skills: {}, upgrades: {}, rep: {},
      tally: {}, captives: {}, dead: {}, dests: {}, seen: {}, axes: {},
      journal: [], build: { knack: knack, habit: habit }, notes: [], screen: null,
      chapterLog: {}

    applyFx(s, h.fx || []);

  };

  FK.clone = function (s) { return JSON.parse(JSON.stringify(s)); };

  FK.mystery = function (s) {
    var M = DB.config.mystery;

    var strong = M.strong.some(function (f) { return s.flags[f]; });

    if (c >= M.suspect) return 1;

  };

  /* ------------------------------------------------------------ effects */

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    if (FK.STATS.indexOf(k) >= 0) { s.stats[k] = clamp(s.stats[k] + d, 0, DB.config.statCap || 5); return; }
    switch (k) {
      case 'hp': s.hp = clamp(s.hp + d, 0, s.maxhp); return;
      case 'maxhp': s.maxhp = clamp(s.maxhp + d, 1, 6); if (d > 0) s.hp += d; return;
      case 'heat': s.heat = clamp(s.heat + d, 0, DB.config.heatMax || 10); return;
      case 'scrap': s.scrap = Math.max(0, s.scrap + d); return;
      case 'sp': s.sp = Math.max(0, s.sp + d); return;
      case 'turn': s.turn = Math.max(0, s.turn + d); return;

    if (!list) return;

      var e = list[i], m;

      if ((m = /^-(\w+)$/.exec(e))) { delete s.flags[m[1]]; continue; }

        addNum(s, m[1], d);
        if (m[1] === 'heat' && d > 0) note(s, 'heat', d > 1 ? 'The house feels a lot less safe.' : 'Somebody could notice that.');
        if (FK.STATS.indexOf(m[1]) >= 0 && d > 0) note(s, 'stat', cap(m[1]) + ' +' + d);
        if (m[1] === 'scrap' && d > 0) note(s, 'scrap', '+' + d + ' scrap');
        if (m[1] === 'sp' && d > 0) note(s, 'sp', 'Skill point earned');
        if (m[1] === 'hp' && d < 0) note(s, 'hurt', 'You are hurt.');
        continue;
      }
      if ((m = /^(\w+)=(-?\d+)$/.exec(e))) {
        var k = m[1], v = +m[2];

          case 'take':
            var ix = s.items.indexOf(arg);
            if (ix >= 0) { s.items.splice(ix, 1); note(s, 'item', 'Lost: ' + (DB.items[arg] ? DB.items[arg].name : arg)); }
            break;
          case 'learn': s.skills[arg] = 1; applyFx(s, (DB.skills[arg] || {}).fx); break;
          case 'up': s.upgrades[arg] = 1; break;

  FK.hubCards = function (s) {

      .filter(function (sl) { return !sl.sub && !sl.forced && FK.available(s, sl); })

  function forcedFor(s) {

  FK.learnable = function (s) {

  };

  FK.buildable = function (s) {
    var L = DB.locs[s.loc];

  };

  FK.visibleChoices = function (s, sl) {

  function enterStory(s, sid) {
    var sl = DB.storylets[sid];

  FK.outcomeOf = function (s, c, win) {

      var dpr = Math.min(G.devicePixelRatio || 1, 2), ctx = cv.getContext('2d'), W, H, nodes = [];
      function size() { var r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
      size();
      var home = { x: 0.5, y: 0.42 };
      var canTravel = S.screen.type === 'hub' && S.loc === 'garage';
      var opts = FK.travelOptions(S);
      function draw(t) {
        t /= 1000;
        var rect = cv.getBoundingClientRect();
        if (Math.round(rect.width * dpr) !== cv.width || !W) size();
        ctx.fillStyle = '#04060a'; ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < 90; i++) { var sx = (i * 97.13 % 1) * W, sy = (i * 61.7 % 1) * H; ctx.fillStyle = 'rgba(200,255,210,' + (0.15 + 0.15 * Math.sin(t + i)) + ')'; ctx.fillRect(sx, sy, 1.2, 1.2); }
        nodes = [];
        var hx = home.x * W, hy = home.y * H;
        Object.keys(DB.dests).forEach(function (id) {
          var d = DB.dests[id], x = d.x * W, y = d.y * H, open = !!S.dests[id], here = S.loc === d.loc;
          ctx.setLineDash(open ? [] : [4, 6]);
          ctx.strokeStyle = open ? 'rgba(141,255,122,' + (0.35 + 0.2 * Math.sin(t * 2)) + ')' : 'rgba(120,130,140,0.25)';
          ctx.lineWidth = open ? 2 : 1;
          ctx.beginPath(); ctx.moveTo(hx, hy); ctx.quadraticCurveTo((hx + x) / 2, Math.min(hy, y) - 40, x, y); ctx.stroke();
          ctx.setLineDash([]); ctx.lineWidth = 1;
          var r = 20 + (here ? 4 * Math.sin(t * 4) : 0);
          var g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.6);
          g.addColorStop(0, open ? d.color : '#2a2f36'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, Math.PI * 2); ctx.fill();
          for (var k = 0; k < 3; k++) {
            ctx.strokeStyle = open ? d.color : '#3a3f48'; ctx.globalAlpha = 0.5;
            var a0 = t * (1 + k * 0.4) + k * 2;
            ctx.beginPath(); ctx.ellipse(x, y, r - k * 4, (r - k * 4) * 0.9, 0, a0, a0 + 4); ctx.stroke(); ctx.globalAlpha = 1;
          }
          ctx.fillStyle = open ? '#e9e4d8' : '#5d616a'; ctx.font = '600 14px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(open ? d.name : '???', x, y + r + 26);
          ctx.font = '12px system-ui, sans-serif'; ctx.fillStyle = '#8dff7a';
          if (S.flags['settled_' + id]) ctx.fillText('settled', x, y + r + 42);
          if (here) { ctx.fillStyle = '#ffd36b'; ctx.fillText('you are here', x, y - r - 12); }
          nodes.push({ id: id, x: x, y: y, r: r * 1.6, open: open });
        });
        // home
        ctx.fillStyle = '#0b0f14'; ctx.strokeStyle = 'rgba(255,200,130,0.7)';
        ctx.beginPath(); ctx.moveTo(hx - 26, hy + 14); ctx.lineTo(hx - 26, hy - 6); ctx.lineTo(hx, hy - 26); ctx.lineTo(hx + 26, hy - 6); ctx.lineTo(hx + 26, hy + 14); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,200,120,' + (0.6 + 0.2 * Math.sin(t * 1.3)) + ')'; ctx.fillRect(hx - 6, hy - 2, 12, 10);
        ctx.fillStyle = '#e9e4d8'; ctx.font = '600 14px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Lindell Court', hx, hy + 34);
        ctx.font = '12px system-ui, sans-serif'; ctx.fillStyle = '#a8a395';
        ctx.fillText(S.flags.garage_open ? 'house + garage' : 'house (garage sealed)', hx, hy + 50);
        if (S.loc === 'house' || S.loc === 'garage' || S.loc === 'street') { ctx.fillStyle = '#ffd36b'; ctx.fillText('you are here', hx, hy - 36); }
        modalTick = requestAnimationFrame(draw);
      }
      modalTick = requestAnimationFrame(draw);
      legend.innerHTML = !S.flags.gun_ready ? 'The portal gun is not working yet. Fix it in the garage to travel.' :
        S.ch !== 2 ? 'The portal is quiet. There is nowhere to go right now.' :
        canTravel ? 'Click a lit destination to open a portal to it.' : 'Portals open from the garage. Go there first.';
      cv.addEventListener('click', function (e) {
        var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
        nodes.forEach(function (n) {
          if (Math.hypot(n.x - x, n.y - y) > n.r) return;
          var opt = opts.filter(function (o) { return o.to === DB.dests[n.id].loc; })[0];
          if (canTravel && opt) { closeModal(); act({ type: 'travel', to: opt.to }); }
          else toast(n.open ? (canTravel ? 'You can\'t get there right now.' : 'Go to the garage to open a portal.') : 'Coordinates unknown.', 'heat');
        });
      });
    });
  }

  function openBase() {
    openModal('Home base: the garage', function (body) {
      if (needGame(body)) return;
      var atBase = S.screen.type === 'hub' && DB.locs[S.loc] && DB.locs[S.loc].base;
      var cv = el('canvas', 'base-art'); body.appendChild(cv);
      requestAnimationFrame(function () { drawBase(cv); });
      body.appendChild(el('p', 'fineprint', (S.flags.garage_open ? (atBase ? 'You are in the garage. Spend scrap to build.' : 'Upgrades are built in the garage, between scenes.') : 'The garage is still sealed.') + ' Scrap: <b>' + S.scrap + '</b>'));
      var list = el('div', 'base-list');
      Object.keys(DB.upgrades).forEach(function (id) {
        var u = DB.upgrades[id], on = !!S.upgrades[id], can = atBase && FK.buildable(S).indexOf(id) >= 0;
        var box = el('div', 'up' + (on ? ' on' : ''), '<h4>' + esc(u.name) + '</h4><p>' + esc(u.desc) + '</p>');
        if (on) box.appendChild(el('div', 'tag puzzle', 'Built'));
        else {
          var reqOk = FK.test(S, u.req);
          var b = button('Build · ' + u.cost + ' scrap', 'primary', function () { act({ type: 'build', id: id }); openBase(); });
          b.disabled = !can;
          box.appendChild(b);
          if (!reqOk) box.appendChild(el('p', 'fineprint', 'Needs: ' + esc(FK.reqLabels(Object.assign({}, S, { items: Object.keys(DB.items), skills: allOn(DB.skills), stats: { muscle: 9, brains: 9, mouth: 9, sneak: 9 }, upgrades: allOn(DB.upgrades) }), u.req).join(' or ') || 'something you haven\'t found yet')));
        }
        list.appendChild(box);
      });
      body.appendChild(list);
    });
  }
  function allOn(o) { var r = {}; Object.keys(o).forEach(function (k) { r[k] = 1; }); return r; }

  function drawBase(cv) {
    var dpr = Math.min(G.devicePixelRatio || 1, 2), r = cv.getBoundingClientRect(), W = r.width, H = r.height, ctx = cv.getContext('2d');
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.strokeRect(10.5, 10.5, W - 21, H - 21);
    var mods = [['bench', 'BENCH'], ['bunk', 'BUNK'], ['cell', 'CELL'], ['calib', 'CALIBRATOR'], ['grid', 'GRID'], ['damper', 'DAMPER']];
    var cw = (W - 40) / mods.length;
    mods.forEach(function (m, i) {
      var on = !!S.upgrades[m[0]], x = 20 + i * cw, y = 30, w = cw - 10, h = H - 60;
      ctx.fillStyle = on ? 'rgba(141,255,122,0.12)' : 'rgba(255,255,255,0.03)';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = on ? 'rgba(141,255,122,0.7)' : 'rgba(255,255,255,0.12)';
      ctx.setLineDash(on ? [] : [4, 4]); ctx.strokeRect(x + 0.5, y + 0.5, w, h); ctx.setLineDash([]);
      ctx.fillStyle = on ? '#bfffb0' : '#555a63'; ctx.font = '600 10px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(m[1], x + w / 2, y + h / 2 + 4);
    });
    ctx.fillStyle = '#a8a395'; ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('GARAGE · ' + Object.keys(S.upgrades).length + ' / ' + mods.length + ' built', 16, 24);
  }

  function openSkills() {
    openModal('Skills', function (body) {
      if (needGame(body)) return;
      body.appendChild(el('p', 'fineprint', 'Skill points: <b>' + S.sp + '</b>. You earn them at milestones. You will never have enough for everything.'));
      var tree = el('div', 'tree'), names = { science: 'Rick\'s science', force: 'Force', talk: 'Street talk', shadow: 'Shadow' };
      ['science', 'force', 'talk', 'shadow'].forEach(function (br) {
        var col = el('div', 'branch'); col.appendChild(el('h4', '', names[br]));
        Object.keys(DB.skills).filter(function (id) { return DB.skills[id].branch === br; })
          .sort(function (a, b) { return DB.skills[a].tier - DB.skills[b].tier; })
          .forEach(function (id) {
            var k = DB.skills[id], on = !!S.skills[id], can = FK.learnable(S).indexOf(id) >= 0;
            var box = el('div', 'sk' + (on ? ' on' : can ? ' can' : ''), '<div class="sk-name">' + esc(k.name) + '</div><div class="sk-desc">' + esc(k.desc) + '</div>');
            if (can) box.appendChild(button('Learn', 'primary', function () { act({ type: 'learn', id: id }); openSkills(); }));
            col.appendChild(box);
          });
        tree.appendChild(col);
      });
      body.appendChild(tree);
    });
  }

  function openJournal() {

      if (needGame(body)) return;
      var cols = el('div', 'cols'), left = el('div'), right = el('div');
      var M = DB.config.mystery, clues = M.clues.filter(function (c) { return S.flags[c]; }).length;
      var lvl = FK.mystery(S);
      left.appendChild(el('div', 'section-label', 'The mystery'));
      left.appendChild(el('p', 'mem', 'Pieces of the puzzle found: <b>' + clues + ' / ' + M.clues.length + '</b>. ' +
        (lvl === 2 ? 'You think you know what happened to the family.' : lvl === 1 ? 'You have a theory. It is a bad one.' : 'You don\'t know what is going on in this house.')));
      left.appendChild(el('div', 'section-label', 'Notes'));
      left.appendChild(el('ul', 'list', S.journal.length ? S.journal.map(function (j) { return '<li class="mem">' + md(j) + '</li>'; }).join('') : '<li class="fineprint">Nothing written down yet.</li>'));
      left.appendChild(el('div', 'section-label', 'How you deal with things'));
      var tl = FK.APPROACHES.map(function (a) { return [a, S.tally[a] || 0]; }), mx = Math.max.apply(null, tl.map(function (x) { return x[1]; }).concat([1]));
      left.appendChild(el('ul', 'list', tl.map(function (x) {
        return '<li><span class="a-' + x[0] + '">' + ICONS.approachName[x[0]] + '</span><span class="rep-bar" style="width:120px"><i style="left:0;width:' + (100 * x[1] / mx) + '%;background:currentColor" class="a-' + x[0] + '"></i></span> ' + x[1] + '</li>';
      }).join('')));
      right.appendChild(el('div', 'section-label', 'People who remember you'));
      var reps = Object.keys(S.rep).filter(function (k) { return S.rep[k] !== 0; });
      right.appendChild(el('ul', 'list', reps.length ? reps.map(function (k) {
        var v = S.rep[k], word = v >= 3 ? 'trusts you' : v >= 1 ? 'warm to you' : v <= -3 ? 'hates you' : 'wary of you';
        var bar = '<span class="rep-bar"><i style="' + (v >= 0 ? 'left:50%;width:' + v * 10 + '%' : 'left:' + (50 + v * 10) + '%;width:' + (-v * 10) + '%;background:var(--danger)') + '"></i></span>';
        return '<li class="mem">' + esc(DB.reps[k] ? DB.reps[k].name : k) + ' · <span style="color:var(--text-dim)">' + word + '</span> ' + bar + '</li>';
      }).join('') : '<li class="fineprint">Nobody yet.</li>'));

      if (caps.length) { right.appendChild(el('div', 'section-label', 'Your prisoners')); right.appendChild(el('ul', 'list', caps.map(function (k) { return '<li class="mem">' + esc(DB.reps[k] ? DB.reps[k].name : k) + '</li>'; }).join(''))); }
      if (dead.length) { right.appendChild(el('div', 'section-label', 'The dead')); right.appendChild(el('ul', 'list', dead.map(function (k) { return '<li class="mem">' + esc(DB.reps[k] ? DB.reps[k].name : k) + '</li>'; }).join(''))); }
      right.appendChild(el('div', 'section-label', 'Hollis'));
      right.appendChild(el('ul', 'list', '<li>Knack: ' + esc(DB.config.knacks[S.build.knack].name) + ' · Habit: ' + esc(DB.config.habits[S.build.habit].name) + '</li>' +
        '<li>' + FK.STATS.map(function (k) { return FK.cap(k) + ' ' + S.stats[k]; }).join(' · ') + '</li><li>Health ' + S.hp + ' / ' + S.maxhp + ' · Exposure ' + S.heat + ' / 10</li>'));
      cols.appendChild(left); cols.appendChild(right); body.appendChild(cols);

  }

  function openBranches(startCh) {
    openModal('Branches found', function (body) {
      var ch = startCh || (S ? Math.min(S.ch, 3) : 1);
      var tabs = el('div', 'tabs');
      [1, 2, 3].forEach(function (n) {
        var b = button('Chapter ' + n + ': ' + esc(DB.chapters[n].title), '', function () { openBranches(n); });
        b.setAttribute('aria-pressed', n === ch ? 'true' : 'false'); tabs.appendChild(b);
      });
      body.appendChild(tabs);
      var f = G.FLOW.build(ch, meta), all = FK.progress(meta);
      var head = el('div', 'flow-head');
      head.style.marginTop = '12px';
      head.innerHTML = '<div class="pct">' + f.pct + '%<small>of chapter ' + ch + '</small></div><div class="pct" style="font-size:24px">' + all.pct + '%<small>of the whole story</small></div>';
      body.appendChild(head);
      body.appendChild(el('div', 'flowbox', f.svg));
      var keys = FK.endingKeys(), got = keys.filter(function (k) { return meta.e[k]; });
      body.appendChild(el('div', 'section-label', 'Endings found: ' + got.length + ' / ' + keys.length));

        var p = k.split('/');
        if (p[0] === 'exit') return E.exits[p[1]].title;
        return E.identities[p[0]].title + ' — ' + E.climaxes[p[3]].title + ', ' + E.guns[p[1]].title + ', ' + E.houses[p[2]].title;
      });
      body.appendChild(el('div', 'endlist', names.map(function (n) { return '<div class="found">' + esc(n) + '</div>'; }).join('') +
        '<div>??? × ' + (keys.length - got.length) + '</div>'));

  }

  function openSaves() {
    openModal('Saves', function (body) {
      var wrap = el('div', 'saves');
      [['fk_auto', 'Autosave'], ['fk_slot_1', 'Slot 1'], ['fk_slot_2', 'Slot 2'], ['fk_slot_3', 'Slot 3']].forEach(function (s) {
        var d = readSave(s[0]), row = el('div', 'save-row');
        row.appendChild(el('div', '', '<b>' + s[1] + '</b><div class="meta">' + (d ? esc(describeSave(d)) : 'Empty') + '</div>'));
        var btns = el('div', 'row');
        if (s[0] !== 'fk_auto' && S && view === 'game' && S.screen.type !== 'death' && S.screen.type !== 'ending') {
          btns.appendChild(button('Save here', '', function () { store(s[0], snapshot(s[1])); toast('Saved to ' + s[1] + '.'); openSaves(); }));
        }
        if (d) btns.appendChild(button('Load', 'primary', function () { loadState(s[0]); }));
        if (d && s[0] !== 'fk_auto') btns.appendChild(button('Delete', 'danger', function () { store(s[0], null); openSaves(); }));
        row.appendChild(btns); wrap.appendChild(row);
      });
      body.appendChild(wrap);
      body.appendChild(el('p', 'fineprint', 'The game autosaves at the start of every scene. Saves live in this browser only.'));
    });
  }

  /* ------------------------------------------------------------ keyboard */
  function onKey(e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (!modal.hidden) { if (e.key === 'Escape') closeModal(); return; }
    if (view !== 'game' || !S) return;
    var t = S.screen.type;
    if ((t === 'result') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act({ type: 'continue' }); return; }
    if (/^[1-9]$/.test(e.key)) {
      var n = +e.key;
      if (t === 'story') { var c = page.querySelectorAll('.choices .choice')[n - 1]; if (c) c.click(); }
      if (t === 'hub') { var k = page.querySelectorAll('.cards .card')[n - 1]; if (k) k.click(); }
    }
  }

  /* ------------------------------------------------------------ boot */
  G.addEventListener('DOMContentLoaded', function () {
    page = $('page'); topbar = $('topbar'); modal = $('modal'); mbody = $('modal-body'); mtitle = $('modal-title');
    $('modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', onKey);
    FX.init($('bg'));
    FX.onThunder = function () { AU.sfx('thunder'); };
    FX.onSpark = function () { AU.sfx('spark'); };
    document.addEventListener('pointerdown', function once() { AU.start(); document.removeEventListener('pointerdown', once); });
    G.addEventListener('beforeunload', flushMeta);
    render();
  });

  /* test hook for the headless check */
  G.FKUI = { state: function () { return S; }, meta: function () { return meta; }, act: function (a) { act(a); }, render: render, loadState: loadState };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
